<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vehículo ESP32</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <main class="container">

        <h1>Vehículo ESP32</h1>

        <section class="controls">

            <button id="forward" class="control-button">
                ▲
            </button>

            <div class="middle-controls">

                <button id="left" class="control-button">
                    ◀
                </button>

                <button id="stop" class="control-button stop">
                    ■
                </button>

                <button id="right" class="control-button">
                    ▶
                </button>

            </div>

            <button id="backward" class="control-button">
                ▼
            </button>

        </section>

        <p id="status">Listo</p>

    </main>

    <script src="/js/script.js"></script>

</body>

</html>
